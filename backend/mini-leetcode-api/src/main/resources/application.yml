spring:
  application:
    name: mini_leetcode
  profiles:
    active: local
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 1800000 # 30 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadminpassword}
    bucket-name: ${MINIO_BUCKET_NAME:testcases}
  judge:
    # Phải khớp với cấu hình của module mini-leetcode-judge (consumer).
    stream-key: ${JUDGE_STREAM_KEY:stream:submissions}
    legacy-queue-key: ${JUDGE_LEGACY_QUEUE_KEY:queue.submissions}
    consumer-group: ${JUDGE_CONSUMER_GROUP:judge-group}
    consumer-name: ${JUDGE_CONSUMER_NAME:}
  console:
    # Console live: API relay WebSocket tới judge worker (KHÔNG publish port judge ra host).
    judge-ws-url: ${JUDGE_CONSOLE_WS_URL:ws://localhost:8081/internal/console/ws}
    # Token nội bộ khớp với app.console.internal-token của mini-leetcode-judge.
    internal-token: ${JUDGE_INTERNAL_TOKEN:mini-leetcode-internal-token}
    # Hạn mức Run mỗi user: runs-per-window lần trong window-seconds giây.
    runs-per-window: ${CONSOLE_RUNS_PER_WINDOW:30}
    window-seconds: ${CONSOLE_WINDOW_SECONDS:600}
    max-files: ${CONSOLE_MAX_FILES:100}
    max-source-bytes: ${CONSOLE_MAX_SOURCE_BYTES:1048576}
  bootstrap:
    # Tạo tài khoản admin đầu tiên khi khởi động (chỉ khi user chưa tồn tại).
    # Để trống để tắt. Mật khẩu phải được cấu hình qua biến môi trường.
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized