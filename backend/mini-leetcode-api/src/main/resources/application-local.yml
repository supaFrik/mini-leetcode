spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mini_leetcode?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:leetcode}
    password: ${DB_PASSWORD:leetcode_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MiniLeetCodeHikariCP
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000 # 5 minutes
      max-lifetime: 1800000 # 30 minutes
      connection-timeout: 20000 # 20 seconds
      leak-detection-threshold: 2000 # 2 seconds
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
