spring:
  application:
    name: mini_leetcode
  profiles:
    active: local
  jpa:
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 1800000 # 30 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadminpassword}
    bucket-name: ${MINIO_BUCKET_NAME:testcases}
  judge:
    # Tên stream chứa bài nộp chờ chấm (dùng chung cho API producer và Judge consumer).
    stream-key: ${JUDGE_STREAM_KEY:stream:submissions}
    # Key Redis List theo cơ chế cũ, chỉ dùng một lần để migrate dữ liệu tồn đọng.
    legacy-queue-key: ${JUDGE_LEGACY_QUEUE_KEY:queue.submissions}
    consumer-group: ${JUDGE_CONSUMER_GROUP:judge-group}
    # Rỗng => tự sinh từ hostname + uuid ngắn.
    consumer-name: ${JUDGE_CONSUMER_NAME:}
    block-timeout-ms: ${JUDGE_BLOCK_TIMEOUT_MS:5000}
    recovery-interval-ms: ${JUDGE_RECOVERY_INTERVAL_MS:30000}
    min-idle-ms: ${JUDGE_MIN_IDLE_MS:120000}
    recovery-batch-size: ${JUDGE_RECOVERY_BATCH_SIZE:50}
    # Bật chạy song song testcase (đổi ngữ nghĩa verdict so với fail-fast tuần tự).
    parallel-testcases: ${JUDGE_PARALLEL_TESTCASES:false}
    max-parallel-testcases: ${JUDGE_MAX_PARALLEL_TESTCASES:4}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized