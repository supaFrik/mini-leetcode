spring:
  application:
    name: mini_leetcode
  profiles:
    active: local
  jpa:
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 1800000 # 30 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadminpassword}
    bucket-name: ${MINIO_BUCKET_NAME:testcases}
    submissions-bucket-name: ${MINIO_SUBMISSIONS_BUCKET_NAME:submissions}
  judge:
    # Tên stream chứa bài nộp chờ chấm (dùng chung cho API producer và Judge consumer).
    stream-key: ${JUDGE_STREAM_KEY:stream:submissions}
    # Key Redis List theo cơ chế cũ, chỉ dùng một lần để migrate dữ liệu tồn đọng.
    legacy-queue-key: ${JUDGE_LEGACY_QUEUE_KEY:queue.submissions}
    consumer-group: ${JUDGE_CONSUMER_GROUP:judge-group}
    # Rỗng => tự sinh từ hostname + uuid ngắn.
    consumer-name: ${JUDGE_CONSUMER_NAME:}
    block-timeout-ms: ${JUDGE_BLOCK_TIMEOUT_MS:5000}
    recovery-interval-ms: ${JUDGE_RECOVERY_INTERVAL_MS:30000}
    min-idle-ms: ${JUDGE_MIN_IDLE_MS:120000}
    recovery-batch-size: ${JUDGE_RECOVERY_BATCH_SIZE:50}
    # Bật chạy song song testcase (đổi ngữ nghĩa verdict so với fail-fast tuần tự).
    parallel-testcases: ${JUDGE_PARALLEL_TESTCASES:false}
    max-parallel-testcases: ${JUDGE_MAX_PARALLEL_TESTCASES:4}
  console:
    # Judge worker chạy servlet web nội bộ (KHÔNG publish port ra host).
    judge-base-url: ${JUDGE_BASE_URL:http://localhost:8081}
    # Token nội bộ khớp với app.console.internal-token của mini-leetcode-judge.
    internal-token: ${JUDGE_INTERNAL_TOKEN:mini-leetcode-internal-token}
    # Số lệnh tối đa cho mỗi phiên console (theo user + problem).
    max-commands-per-session: ${CONSOLE_MAX_COMMANDS_PER_SESSION:50}
    # TTL transcript trong Redis (giây).
    transcript-ttl-seconds: ${CONSOLE_TRANSCRIPT_TTL_SECONDS:3600}
    # Giới hạn payload mã nguồn.
    max-source-bytes: ${CONSOLE_MAX_SOURCE_BYTES:20971520}
    max-files: ${CONSOLE_MAX_FILES:100}
    # Timeout gọi judge worker (ms).
    request-timeout-ms: ${CONSOLE_REQUEST_TIMEOUT_MS:20000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized