spring:
  application:
    name: mini_leetcode_judge
  main:
    # Judge worker là servlet web app để phục vụ WebSocket console live nội bộ.
    # Cổng KHÔNG được publish ra host (chỉ trong docker network nội bộ).
    web-application-type: servlet
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mini_leetcode?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:leetcode}
    password: ${DB_PASSWORD:leetcode_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}

app:
  judge:
    # Phải khớp với cấu hình của module mini-leetcode-api (producer).
    stream-key: ${JUDGE_STREAM_KEY:stream:submissions}
    legacy-queue-key: ${JUDGE_LEGACY_QUEUE_KEY:queue.submissions}
    consumer-group: ${JUDGE_CONSUMER_GROUP:judge-group}
    consumer-name: ${JUDGE_CONSUMER_NAME:}
    block-timeout-ms: ${JUDGE_BLOCK_TIMEOUT_MS:5000}
    recovery-interval-ms: ${JUDGE_RECOVERY_INTERVAL_MS:30000}
    min-idle-ms: ${JUDGE_MIN_IDLE_MS:120000}
    recovery-batch-size: ${JUDGE_RECOVERY_BATCH_SIZE:50}
    parallel-testcases: ${JUDGE_PARALLEL_TESTCASES:false}
    max-parallel-testcases: ${JUDGE_MAX_PARALLEL_TESTCASES:4}
  minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadminpassword}
    bucket-name: ${MINIO_BUCKET_NAME:testcases}
  console:
    # Token header X-Internal-Token cho WebSocket /internal/console/ws.
    # PHẢI khớp với app.console.internal-token của mini-leetcode-api.
    internal-token: ${JUDGE_INTERNAL_TOKEN:mini-leetcode-internal-token}
    # Giới hạn mỗi lần Run của console live.
    max-wall-ms: ${CONSOLE_MAX_WALL_MS:120000}
    idle-ms: ${CONSOLE_IDLE_MS:30000}
    max-output-bytes: ${CONSOLE_MAX_OUTPUT_BYTES:65536}
    max-concurrent: ${CONSOLE_MAX_CONCURRENT:20}
    memory-limit-mb: ${CONSOLE_MEMORY_LIMIT_MB:256}

server:
  # Cổng nội bộ — KHÔNG publish ra host trong docker-compose.
  port: ${JUDGE_SERVER_PORT:8081}
  shutdown: graceful
